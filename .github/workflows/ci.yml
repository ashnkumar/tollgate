name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors out if the version is
      # given in two places, and package.json's `packageManager` field is the one that
      # also pins the version developers get locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The contract tests import typings hardhat generates, so `pnpm lint` compiles the
      # contracts on the way through. It is incremental, and this is a fresh checkout.
      - name: Typecheck
        run: pnpm lint

      # Contract tests first: they cover the money, and the smoke test below needs
      # the compiled artifacts anyway.
      - name: Unit tests
        run: pnpm test

      # The whole stack against a real local chain, with the fake model so no API
      # key or network access is needed.
      - name: Smoke test
        run: ./scripts/smoke.sh
