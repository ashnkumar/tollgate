name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      # Contract tests first: they cover the money, and the smoke test below needs
      # the compiled artifacts anyway.
      - name: Unit tests
        run: pnpm test

      # The whole stack against a real local chain, with the fake model so no API
      # key or network access is needed.
      - name: Smoke test
        run: ./scripts/smoke.sh
